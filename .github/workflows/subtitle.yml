name: subtitle
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'
concurrency:
  group: subtitle
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install deps
        run: |
          pip install -q requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: enable BBR
        run: |
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sysctl net.ipv4.tcp_congestion_control || true
      - name: run subtitle
        env:
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          DEEPGRAM_KEY: ${{ secrets.DEEPGRAM_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          ASR: ${{ secrets.ASR }}
          ROOT: ${{ secrets.ROOT }}
        run: python sub.py
