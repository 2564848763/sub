name: subtitle

on:
  workflow_dispatch:
    inputs:
      root:
        description: '临时指定目录(留空=用Secrets里的ROOT)'
        default: ''
  schedule:
    - cron: '0 */8 * * *'   # 每8小时自动跑一次(公开仓库分钟无限)

concurrency:
  group: subtitle
  cancel-in-progress: false   # 同一时间只跑一个, 新的排队, 不打断正在跑的

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # 单次最长约6小时, 到点自动停, 下次定时接着跑
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: run subtitle
        env:
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          ROOT: ${{ github.event.inputs.root || secrets.ROOT }}
          ENGINE: deepseek
          REFINE: 'false'
          BUDGET: '9.8'
        run: python sub.py
