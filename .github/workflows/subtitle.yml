name: subtitle

on:
  workflow_dispatch:
    inputs:
      root:
        description: '临时指定目录(留空=用Secrets里的ROOT)'
        default: ''
  schedule:
    - cron: '0 */8 * * *'

concurrency:
  group: subtitle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -q requests
      - name: run subtitle
        env:
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          DEEPGRAM_KEY: ${{ secrets.DEEPGRAM_KEY }}
          ASR: ${{ secrets.ASR }}
          KEYTERMS: ${{ secrets.KEYTERMS }}
          ITALIC_SFX: ${{ secrets.ITALIC_SFX }}
          CTX_VIEW: ${{ secrets.CTX_VIEW }}
          CTX_MAP: ${{ secrets.CTX_MAP }}
          ROOT: ${{ github.event.inputs.root || secrets.ROOT }}
          ENGINE: deepseek
          REFINE: 'false'
          BUDGET: '9.8'
        run: python sub.py
